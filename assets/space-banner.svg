<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03040d"/>
      <stop offset="0.55" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="0.5" stop-color="#e0572f"/>
      <stop offset="1" stop-color="#3b0d1f"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <style>
      .star{fill:#fff;animation:tw 3s ease-in-out infinite}
      .s2{animation-delay:1s}.s3{animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      .hud{fill:none;stroke:#00e5ff;stroke-width:2;opacity:.8}
      .title{font:700 54px 'Orbitron','Segoe UI',monospace;fill:#e8f6ff;letter-spacing:6px}
      .sub{font:500 20px 'Share Tech Mono','Consolas',monospace;fill:#00e5ff;letter-spacing:3px}
      .tiny{font:12px 'Consolas',monospace;fill:#7f8db8;letter-spacing:2px}
      .blink{animation:bl 1.2s steps(2) infinite}
      @keyframes bl{50%{opacity:0}}
      .orbit{transform-origin:960px 165px;animation:spin 14s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .scan{animation:scan 4s linear infinite}
      @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(320px)}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- starfield -->
  <g>
    <circle class="star" cx="40" cy="30" r="1.2"/><circle class="star s2" cx="120" cy="90" r="1"/>
    <circle class="star s3" cx="210" cy="40" r="1.5"/><circle class="star" cx="300" cy="270" r="1"/>
    <circle class="star s2" cx="380" cy="20" r="1.3"/><circle class="star s3" cx="460" cy="290" r="1"/>
    <circle class="star" cx="540" cy="35" r="1"/><circle class="star s2" cx="620" cy="280" r="1.4"/>
    <circle class="star s3" cx="700" cy="25" r="1"/><circle class="star" cx="760" cy="300" r="1.2"/>
    <circle class="star s2" cx="820" cy="60" r="1"/><circle class="star s3" cx="1100" cy="40" r="1.5"/>
    <circle class="star" cx="1160" cy="270" r="1"/><circle class="star s2" cx="1060" cy="295" r="1.2"/>
    <circle class="star s3" cx="70" cy="250" r="1.4"/><circle class="star" cx="160" cy="300" r="1"/>
    <circle class="star s2" cx="250" cy="150" r="0.9"/><circle class="star s3" cx="1180" cy="140" r="1"/>
  </g>

  <!-- planet + ring + orbiting satellite -->
  <circle cx="960" cy="165" r="150" fill="url(#glow)"/>
  <circle cx="960" cy="165" r="78" fill="url(#planet)"/>
  <ellipse cx="960" cy="165" rx="130" ry="26" fill="none" stroke="#ffcf9e" stroke-width="3" opacity=".55" transform="rotate(-18 960 165)"/>
  <g class="orbit">
    <ellipse cx="960" cy="165" rx="115" ry="115" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 8" opacity=".35"/>
    <g transform="translate(1075 165)">
      <rect x="-6" y="-5" width="12" height="10" fill="#cfd8ff"/>
      <rect x="-22" y="-3" width="14" height="6" fill="#00e5ff"/>
      <rect x="8" y="-3" width="14" height="6" fill="#00e5ff"/>
    </g>
  </g>

  <!-- HUD frame -->
  <path class="hud" d="M20 60 V20 H70 M1130 20 H1180 V60 M1180 260 V300 H1130 M70 300 H20 V260"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#00e5ff" opacity=".12"/>

  <!-- text -->
  <text x="70" y="70" class="tiny">MISSION CONTROL // CREW FILE #001 // STATUS: <tspan fill="#39ff88">ONLINE</tspan></text>
  <text x="70" y="160" class="title">HARSH LAKKAD</text>
  <text x="72" y="200" class="sub">&gt; SPACE SYSTEMS · PYTHON · MATLAB · C/C++<tspan class="blink">_</tspan></text>
  <text x="72" y="235" class="tiny">BASE: GERMANY · GITHUB/HARRY3158</text>
  <text x="72" y="280" class="tiny">⟶ ENGINEERING · BUILDING · EXPLORING</text>
</svg>
